<div class="panel">
  <h2>📝 Transaksi Baru</h2>
  <div id="fNote" class="toast" hidden></div>
  <form id="formTrx" novalidate>
    <div class="grid2">
      <div>
        <div class="fld"><label for="nama">Nama Pelanggan</label><input id="nama" name="nama" placeholder="Contoh: Budi Santoso"><span class="err"></span></div>
        <div class="fld"><label for="no_hp">No. HP / WhatsApp</label><input id="no_hp" name="no_hp" inputmode="tel" placeholder="08xxxxxxxxxx"><span class="err"></span></div>
        <div class="fld"><label for="jenis_layanan">Jenis Layanan</label><select id="jenis_layanan" name="jenis_layanan"></select><span class="err"></span></div>
        <div class="fld"><label for="berat_qty" id="fQtyLbl">Berat (kg)</label><input type="number" id="berat_qty" name="berat_qty" step="0.1" placeholder="0"><span class="err"></span></div>
      </div>
      <div>
        <div class="fld"><label for="metode_pembayaran">Metode Pembayaran</label>
          <select id="metode_pembayaran" name="metode_pembayaran"><option value="">-- pilih --</option><option>Tunai</option><option>QRIS</option><option>Transfer</option></select><span class="err"></span></div>
        <div class="fld"><label for="status_pembayaran">Status Pembayaran</label>
          <select id="status_pembayaran" name="status_pembayaran"><option value="">-- pilih --</option><option>Lunas</option><option>Belum Lunas</option></select><span class="err"></span></div>
        <div class="fld"><label for="catatan">Catatan (opsional)</label><textarea id="catatan" name="catatan" rows="3" maxlength="150"></textarea><span class="err"></span></div>
        <div class="rincian"><div class="tot"><span>TOTAL</span><span id="fTotal">Rp 0</span></div></div>
      </div>
    </div>
    <p><button type="submit" class="btn">Simpan Transaksi</button> <button type="reset" class="btn sec" id="fReset">Batal</button></p>
  </form>
</div>
