<div class="panel">
  <h2>🧮 Simulasi Kasir</h2>
  <p style="color:var(--mut)">Hitung biaya laundry dan uang kembalian secara langsung sebelum transaksi disimpan.</p>
  <div class="grid2">
    <div>
      <div class="fld"><label>Jenis Layanan</label><select id="kLayanan"></select></div>
      <div class="fld"><label id="kQtyLbl">Berat (kg)</label><input type="number" id="kQty" min="0" step="0.1" value="1"></div>
      <div class="fld"><label>Status Pelanggan</label>
        <select id="kDiskon"><option value="0">Umum (0%)</option><option value="5">Member (5%)</option><option value="10">VIP (10%)</option></select></div>
      <div class="fld"><label><input type="checkbox" id="kAntar" style="width:auto"> Antar-jemput (+ Rp 5.000)</label></div>
      <div class="fld"><label>Uang Diterima (Rp)</label><input type="number" id="kBayar" min="0" step="1000" placeholder="0"></div>
    </div>
    <div class="rincian">
      <div><span>Tarif</span><span id="rTarif">-</span></div>
      <div><span>Subtotal</span><span id="rSub">Rp 0</span></div>
      <div><span>Diskon</span><span id="rDisk">- Rp 0</span></div>
      <div><span>Antar-jemput</span><span id="rAntar">Rp 0</span></div>
      <div><span>Estimasi selesai</span><span id="rEst">-</span></div>
      <div class="tot"><span>TOTAL</span><span id="rTotal">Rp 0</span></div>
      <div><span id="rKLbl">Kembalian</span><strong id="rKembali">Rp 0</strong></div>
    </div>
  </div>
  <p><button class="btn" id="kLanjut">Lanjut ke Transaksi Baru →</button> <button class="btn sec" id="kReset">Reset</button></p>
</div>
